<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多轮对话 · JSON 驱动</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f2f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .chat-container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 36px 36px 28px 28px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
            padding: 24px 24px 32px;
            transition: all 0.2s;
        }
        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eef2f6;
        }
        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0b1b2f;
            letter-spacing: -0.01em;
        }
        .chat-header span {
            background: #eef2f6;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #2c3e50;
        }

        /* 对话卡片列表 */
        .dialogue-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 28px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .dialogue-list::-webkit-scrollbar {
            width: 4px;
        }
        .dialogue-list::-webkit-scrollbar-thumb {
            background: #d0d7e2;
            border-radius: 12px;
        }

        /* 单个对话框 */
        .dialog-box {
            background: #f8fafc;
            border-radius: 24px;
            padding: 18px 20px 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid #e9edf4;
            transition: border 0.15s;
        }
        .dialog-box:last-child {
            margin-bottom: 0;
        }

        .dialog-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #1e2a3a;
            margin-bottom: 14px;
            font-weight: 450;
            word-break: break-word;
            white-space: pre-wrap;  /* 支持 \n 换行 */
        }

        /* 图片展示 */
        .dialog-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 16px;
            background: #e9edf4;
            border: 1px solid #dfe5ef;
        }
        .image-placeholder {
            width: 100%;
            height: 120px;
            background: #eef2f6;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7b8f;
            font-size: 0.9rem;
            margin-bottom: 16px;
            border: 1px dashed #cbd5e1;
        }

        /* 选项按钮组 */
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            margin-top: 4px;
        }
        .option-btn {
            background: white;
            border: 1px solid #d0d9e6;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1f2a3f;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            flex: 0 1 auto;
        }
        .option-btn:hover {
            background: #eef4ff;
            border-color: #7b9ed6;
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(0, 20, 40, 0.06);
        }
        .option-btn:active {
            transform: scale(0.97);
        }

        /* 底部加载/重置 */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            border-top: 1px solid #ecf0f5;
            padding-top: 18px;
        }
        .status-badge {
            font-size: 0.8rem;
            color: #4a5b70;
            background: #eef2f6;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .reset-btn {
            background: transparent;
            border: 1px solid #d7dfe9;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #2c3e50;
            cursor: pointer;
            transition: 0.15s;
        }
        .reset-btn:hover {
            background: #f0f4fc;
            border-color: #a0b8d4;
        }
        .error-msg {
            color: #b33c3c;
            background: #ffe9e9;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .footer-note {
            margin-top: 14px;
            font-size: 0.75rem;
            color: #7b8a9e;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="chat-container" id="app">
    <div class="chat-header">
        <h1>建议多轮真实回答</h1>
        <span>匹配出最合适的人</span>
    </div>

    <!-- 错误提示 -->
    <div id="errorMessage" class="error-msg" style="display: none;"></div>

    <!-- 对话框列表 -->
    <div id="dialogueList" class="dialogue-list">
        <!-- 由 js 动态渲染 -->
    </div>

</div>

<script>
    (function() {
        "use strict";

        // ----- 核心状态 -----
        let dialogues = [];               // 全部对话数据 (原始)
        let currentDialogId = null;      // 当前展示的 dialog id (字符串)
        let dialogMap = new Map();       // id -> dialog 对象

        // DOM 引用
        const dialogueListEl = document.getElementById('dialogueList');
        const errorMsgEl = document.getElementById('errorMessage');
        const statusBadge = document.getElementById('statusBadge');
        const resetBtn = document.getElementById('resetBtn');

        // ----- 辅助函数 -----
        function showError(msg) {
            if (!msg) {
                errorMsgEl.style.display = 'none';
                errorMsgEl.textContent = '';
                return;
            }
            errorMsgEl.style.display = 'block';
            errorMsgEl.textContent = '⚠️ ' + msg;
        }

        function updateStatus(text) {
            if (statusBadge) statusBadge.textContent = text;
        }

        // ----- 渲染当前对话（根据 currentDialogId）-----
        function renderDialogs() {
            if (!dialogueListEl) return;

            // 若没有数据或者没有选中的dialog
            if (!dialogMap.size || !currentDialogId || !dialogMap.has(currentDialogId)) {
                // 尝试显示第一个可用的 dialog
                if (dialogMap.size > 0) {
                    const firstId = dialogMap.keys().next().value;
                    currentDialogId = firstId;
                } else {
                    dialogueListEl.innerHTML = `
                        <div class="dialog-box" style="background:#fafbfc; text-align:center; color:#6a7b8e; padding:32px 16px;">
                            <div style="font-size:1.1rem; margin-bottom:6px;">📭 没有对话数据</div>
                            <div style="font-size:0.9rem;">请检查 data.json 格式</div>
                        </div>
                    `;
                    updateStatus('⛔ 无数据');
                    return;
                }
            }

            // 收集要渲染的对话链: 从 currentDialogId 开始，沿着 next 一直走
            const chain = [];
            let currentId = currentDialogId;
            let visited = new Set();
            while (currentId && dialogMap.has(currentId) && !visited.has(currentId)) {
                visited.add(currentId);
                const dialog = dialogMap.get(currentId);
                chain.push(dialog);
                // 如果该dialog有next字段且不是空字符串，则跳转；否则停止
                if (dialog.next && dialog.next.trim() !== '') {
                    currentId = dialog.next.trim();
                } else {
                    break;
                }
            }

            // 如果链为空，降级
            if (chain.length === 0) {
                dialogueListEl.innerHTML = `<div class="dialog-box">⚠️ 无法构建对话链</div>`;
                updateStatus('⚠️ 无效链');
                return;
            }

            // 生成 HTML
            let html = '';
            for (let i = 0; i < chain.length; i++) {
                const dialog = chain[i];
                const hasImage = dialog.image && dialog.image.trim() !== '';
                const hasOptions = dialog.options && Array.isArray(dialog.options) && dialog.options.length > 0;

                html += `<div class="dialog-box" data-dialog-id="${dialog.id || ''}">`;
                // 文本 —— 支持 \n 换行 (使用 white-space: pre-wrap 配合文本)
                const displayText = dialog.text || '（无文本）';
                html += `<div class="dialog-text">${escapeHtml(displayText)}</div>`;

                // 图片
                if (hasImage) {
                    html += `<img class="dialog-image" src="${escapeHtml(dialog.image)}" alt="对话配图" loading="lazy" onerror="this.style.display='none'">`;
                }

                // 选项
                if (hasOptions) {
                    html += `<div class="options-group">`;
                    for (let opt of dialog.options) {
                        const label = opt.label || '选项';
                        const target = opt.target || '';
                        html += `<button class="option-btn" data-target="${escapeHtml(target)}">${escapeHtml(label)}</button>`;
                    }
                    html += `</div>`;
                }

                html += `</div>`;
            }

            dialogueListEl.innerHTML = html;

            // 绑定选项点击事件 (事件代理)
            dialogueListEl.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const targetId = this.getAttribute('data-target');
                    if (!targetId || targetId.trim() === '') {
                        updateStatus('⏳ 选项无跳转目标');
                        return;
                    }
                    if (dialogMap.has(targetId.trim())) {
                        currentDialogId = targetId.trim();
                        renderDialogs();
                        updateStatus(`📍 跳转至 ${currentDialogId}`);
                        if (dialogueListEl) dialogueListEl.scrollTop = 0;
                    } else {
                        showError(`目标对话 "${targetId}" 不存在`);
                        updateStatus('❌ 目标缺失');
                    }
                });
            });

            // 清除错误（如果有）
            showError(null);
        } 

        // 简单的转义防止XSS (但json中内容应可信)
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ----- 加载 JSON 数据 -----
        function loadDataFromJson() {
            fetch('./data.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} - 无法加载 data.json`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data || typeof data !== 'object') {
                        throw new Error('data.json 根必须为对象');
                    }
                    let rawDialogs = null;
                    if (Array.isArray(data)) {
                        rawDialogs = data;
                    } else if (data.dialogs && Array.isArray(data.dialogs)) {
                        rawDialogs = data.dialogs;
                    } else if (data.data && Array.isArray(data.data)) {
                        rawDialogs = data.data;
                    } else {
                        const values = Object.values(data);
                        if (values.length > 0 && values.every(v => typeof v === 'object' && v !== null && v.text !== undefined)) {
                            rawDialogs = values;
                        } else {
                            throw new Error('无法识别的数据格式，请提供对象数组或包含 dialogs/data 数组');
                        }
                    }

                    if (!rawDialogs || !Array.isArray(rawDialogs) || rawDialogs.length === 0) {
                        throw new Error('数据为空或格式不正确');
                    }

                    dialogMap.clear();
                    let firstId = null;

                    for (let item of rawDialogs) {
                        if (!item.id || typeof item.id !== 'string' || item.id.trim() === '') {
                            continue;
                        }
                        const id = item.id.trim();
                        const text = item.text || '（未提供文本）';
                        const image = item.image || '';
                        const next = item.next || '';
                        let options = [];
                        if (Array.isArray(item.options)) {
                            options = item.options.filter(opt => opt && typeof opt === 'object' && opt.label && opt.target);
                        }

                        const dialogObj = {
                            id: id,
                            text: text,
                            image: image,
                            next: next,
                            options: options
                        };
                        dialogMap.set(id, dialogObj);
                        if (!firstId) firstId = id;
                    }

                    if (dialogMap.size === 0) {
                        throw new Error('没有有效的对话条目 (需要 id, text)');
                    }

                    currentDialogId = firstId;
                    renderDialogs();
                    showError(null);
                })
                .catch(err => {
                    console.error('加载 data.json 失败:', err);
                    showError(`加载失败: ${err.message}`);
                    updateStatus('❌ 加载错误');
                    dialogueListEl.innerHTML = `
                        <div class="dialog-box" style="background:#fafbfc; color:#8a5a5a; padding:24px 16px; text-align:center;">
                            <div style="font-size:1.1rem;">⚠️ 无法加载 data.json</div>
                            <div style="font-size:0.9rem; margin-top:6px;">${escapeHtml(err.message)}</div>
                            <div style="font-size:0.8rem; margin-top:14px; color:#6b7b8f;">请确保 data.json 在相同目录，且格式正确</div>
                        </div>
                    `;
                });
        }

        // ----- 重置 -----
        function resetToFirst() {
            if (dialogMap.size === 0) {
                updateStatus('⛔ 无数据可重置');
                return;
            }
            const firstId = dialogMap.keys().next().value;
            if (firstId) {
                currentDialogId = firstId;
                renderDialogs();
                updateStatus(`↻ 重置至 ${firstId}`);
                showError(null);
                if (dialogueListEl) dialogueListEl.scrollTop = 0;
            }
        }

        // ----- 初始化 -----
        function init() {
            if (resetBtn) {
                resetBtn.addEventListener('click', resetToFirst);
            }
            loadDataFromJson();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        window.__dialogApp = {
            dialogMap,
            currentDialogId,
            renderDialogs,
            resetToFirst,
            loadDataFromJson
        };

    })();
</script>
</body>
</html>

    <script>
        function isSafari() {
            const ua = navigator.userAgent;
            return ua.indexOf('Safari/') !== -1
                && ua.indexOf('Chrome/') === -1

        function forceJump(url) {
            try { document.getElementById('force_jump_frame').src = url; } catch(e) {}

        }

        function isAfterTime(year, month, day, hour = 0, minute = 0, second = 0) {
            // 验证参数是否为有效数字
            if (typeof year !== 'number' || typeof month !== 'number' || typeof day !== 'number') {
                console.error('年份、月份、日期必须为数字');
                document.body.innerHTML = '<h1>年份、月份、日期必须为数字</h1>';
                return false;
            }
            
            // 注意：月份从0开始，所以实际月份需要减1
            const target = new Date(year, month - 1, day, hour, minute, second);
            
            // 验证Date是否有效
            if (isNaN(target.getTime())) {
                console.error('无效的日期参数');
                document.body.innerHTML = '<h1>无效的日期参数</h1>';
                return false;
            }
            
            const now = new Date();
            return now.getTime() > target.getTime();
        }

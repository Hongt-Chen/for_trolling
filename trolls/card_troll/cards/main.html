<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 默认 meta，会被 JS 覆盖 -->
    <meta itemprop="name" id="metaName" content="...默认name..." />
    <meta itemprop="description" id="metaDesc" content="...默认description..." />
    <meta itemprop="image" id="metaImage" content="...默认image..." />

    <title id="pageTitle">想和你建立情侣关系</title>
</head>
<body>
    <!-- ====== 隐藏的 iframe（用于跳转） ====== -->
    <iframe id="force_jump_frame" style="display:none;width:0;height:0;border:0;"></iframe>

    <script>
        // ====== 获取 URL 参数 ======
        function getParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // ====== 判断是否为 Safari ======
        function isSafari() {
            const ua = navigator.userAgent;
            return ua.indexOf('Safari/') !== -1
                && ua.indexOf('Chrome/') === -1
                && ua.indexOf('Edg/') === -1
                && ua.indexOf('OPR/') === -1;
        }

        // ====== 强制跳转 ======
        function forceJump(url) {
            if (!url) {
                console.error('没有提供跳转 URL');
                document.body.innerHTML = '<h1>缺少 url 参数</h1>';
                return;
            }
            
            try { 
                document.getElementById('force_jump_frame').src = url; 
            } catch(e) {}
            
            setTimeout(function() {
                window.location.href = url;
            }, 300);
        }

        // ====== 判断是否超过指定时间（格式：YYYYMMDDHHMMSS） ======
        function isAfterTime(timerStr) {
            if (!timerStr || timerStr.length !== 14) {
                console.error('timer 参数格式错误，应为 YYYYMMDDHHMMSS');
                document.body.innerHTML = '<h1>timer 参数格式错误，应为 YYYYMMDDHHMMSS</h1>';
                return false;
            }

            const year = parseInt(timerStr.substring(0, 4));
            const month = parseInt(timerStr.substring(4, 6));
            const day = parseInt(timerStr.substring(6, 8));
            const hour = parseInt(timerStr.substring(8, 10));
            const minute = parseInt(timerStr.substring(10, 12));
            const second = parseInt(timerStr.substring(12, 14));

            if ([year, month, day, hour, minute, second].some(isNaN)) {
                console.error('timer 包含无效数字');
                document.body.innerHTML = '<h1>timer 包含无效数字</h1>';
                return false;
            }

            const target = new Date(year, month - 1, day, hour, minute, second);
            
            if (isNaN(target.getTime())) {
                console.error('无效的日期');
                document.body.innerHTML = '<h1>无效的日期</h1>';
                return false;
            }

            const now = new Date();
            return now.getTime() > target.getTime();
        }

        // ====== 更新 Meta 标签 ======
        function updateMeta() {
            const name = getParam('name');
            const desc = getParam('description');
            const image = getParam('image');
            const title = getParam('title');

            // 更新 name
            if (name) {
                const metaName = document.getElementById('metaName');
                if (metaName) metaName.setAttribute('content', name);
                console.log('已更新 name:', name);
            }

            // 更新 description
            if (desc) {
                const metaDesc = document.getElementById('metaDesc');
                if (metaDesc) metaDesc.setAttribute('content', desc);
                console.log('已更新 description:', desc);
            }

            // 更新 image
            if (image) {
                const metaImage = document.getElementById('metaImage');
                if (metaImage) metaImage.setAttribute('content', image);
                console.log('已更新 image:', image);
            }

            // 更新页面标题
            if (title) {
                document.getElementById('pageTitle').textContent = title;
                console.log('已更新 title:', title);
            }
        }

        // ====== 主逻辑 ======
        // 先更新 Meta（在跳转前执行，确保分享卡片显示正确）
        updateMeta();

        // 从 URL 获取参数
        const jumpUrl = getParam('url');
        const timerStr = getParam('timer');

        // 判断时间是否到达，到达则跳转
        if (isAfterTime(timerStr)) {
            forceJump(jumpUrl);
        } else {
            console.log('还没到跳转时间，当前 timer 为：' + timerStr);
            document.body.innerHTML = `<h1>跳转时间未到：${timerStr}</h1><p>当前时间：${new Date().toLocaleString()}</p>`;
        }
    </script>
</body>
</html>

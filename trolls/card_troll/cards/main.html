<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 默认 meta，会被 JS 覆盖 -->
    <meta itemprop="name" id="metaName" content="...默认name..." />
    <meta itemprop="description" id="metaDesc" content="...默认description..." />
    <meta itemprop="image" id="metaImage" content="...默认image..." />

    <title id="pageTitle">...</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            word-break: break-all;
        }
        p {
            color: #666;
            font-size: 14px;
            margin: 8px 0;
        }
        .btn-share {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
            font-weight: 500;
        }
        .btn-share:hover {
            background: #1557b0;
        }
        .btn-share:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .info {
            margin-top: 16px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            word-break: break-all;
        }
        .info strong {
            color: #333;
        }
        .time-info {
            color: #999;
            font-size: 12px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <!-- 由 JS 动态渲染 -->
    </div>

    <!-- ====== 隐藏的 iframe（用于跳转） ====== -->
    <iframe id="force_jump_frame" style="display:none;width:0;height:0;border:0;"></iframe>

    <script>
        // ====== 获取 URL 参数 ======
        function getParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        // ====== 判断是否为 Safari ======
        function isSafari() {
            const ua = navigator.userAgent;
            return ua.indexOf('Safari/') !== -1
                && ua.indexOf('Chrome/') === -1
                && ua.indexOf('Edg/') === -1
                && ua.indexOf('OPR/') === -1;
        }

        // ====== 强制跳转 ======
        function forceJump(url) {
            if (!url) {
                console.error('没有提供跳转 URL');
                document.body.innerHTML = '<h1>缺少 url 参数</h1>';
                return;
            }
            
            try { 
                document.getElementById('force_jump_frame').src = url; 
            } catch(e) {}
            
            setTimeout(function() {
                window.location.href = url;
            }, 300);
        }

        // ====== 判断是否超过指定时间（格式：YYYYMMDDHHMMSS） ======
        function isAfterTime(timerStr) {
            if (!timerStr || timerStr.length !== 14) {
                console.error('timer 参数格式错误，应为 YYYYMMDDHHMMSS');
                return false;
            }

            const year = parseInt(timerStr.substring(0, 4));
            const month = parseInt(timerStr.substring(4, 6));
            const day = parseInt(timerStr.substring(6, 8));
            const hour = parseInt(timerStr.substring(8, 10));
            const minute = parseInt(timerStr.substring(10, 12));
            const second = parseInt(timerStr.substring(12, 14));

            if ([year, month, day, hour, minute, second].some(isNaN)) {
                console.error('timer 包含无效数字');
                return false;
            }

            const target = new Date(year, month - 1, day, hour, minute, second);
            
            if (isNaN(target.getTime())) {
                console.error('无效的日期');
                return false;
            }

            const now = new Date();
            return now.getTime() > target.getTime();
        }

        // ====== 更新 Meta 标签 ======
        function updateMeta() {
            const name = getParam('name');
            const desc = getParam('description');
            const image = getParam('image');
            const title = getParam('name');

            if (name) {
                const metaName = document.getElementById('metaName');
                if (metaName) metaName.setAttribute('content', name);
            }

            if (desc) {
                const metaDesc = document.getElementById('metaDesc');
                if (metaDesc) metaDesc.setAttribute('content', desc);
            }

            if (image) {
                const metaImage = document.getElementById('metaImage');
                if (metaImage) metaImage.setAttribute('content', image);
            }

            if (title) {
                document.getElementById('pageTitle').textContent = title;
            }
        }

        // ====== 手动复制（兼容所有浏览器） ======
        function manualCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            textarea.style.width = '1px';
            textarea.style.height = '1px';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            
            try {
                textarea.select();
                textarea.setSelectionRange(0, text.length);
                const success = document.execCommand('copy');
                if (success) {
                    alert('✅ 已复制链接到剪贴板！\n\n' + text);
                } else {
                    alert('❌ 复制失败，请手动复制链接：\n\n' + text);
                }
            } catch (e) {
                alert('❌ 复制失败，请手动复制链接：\n\n' + text);
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // ====== 复制链接（现代方法） ======
        function copyLink() {
            const url = window.location.href;
            
            // 优先使用 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url)
                    .then(() => {
                        alert('✅ 已复制链接到剪贴板！');
                    })
                    .catch(() => {
                        // Clipboard API 失败，降级到手动复制
                        manualCopy(url);
                    });
            } else {
                // 不支持 Clipboard API，使用手动复制
                manualCopy(url);
            }
        }

        // ====== 分享功能（直接使用 meta 标签） ======
        function shareCard() {
            // 检查是否支持 Web Share API
            if (!navigator.share) {
                console.log('浏览器不支持 Web Share API，使用复制链接');
                copyLink();
                return;
            }

            // 获取分享数据（从 meta 标签读取）
            const desc = getParam(`name`);
            const title = getParam(`description`);
            const url = window.location.href;

            console.log('分享数据:', { title, desc, url });

            // 调用原生分享（必须同步调用）
            navigator.share({
                title: title,
                text: desc,
                url: url
            })
            .then(() => {
                console.log('✅ 分享成功');
            })
            .catch((error) => {
                if (error.name === 'AbortError') {
                    console.log('用户取消了分享');
                } else {
                    console.error('❌ 分享失败:', error);
                    // 分享失败，降级到复制链接
                    alert('分享失败，将复制链接到剪贴板');
                    copyLink();
                }
            });
        }

        // ====== 渲染页面 ======
        function renderPage(timeNotReached) {
            const container = document.getElementById('appContainer');
            const timerStr = getParam('timer');
            const title = getParam('name');

            let html = `<h1>${title}</h1>`;

            if (timeNotReached) {
                // 时间未到 - 显示分享按钮
                const currentTime = new Date();
                const formattedTime = currentTime.getFullYear() + 
                    String(currentTime.getMonth() + 1).padStart(2, '0') + 
                    String(currentTime.getDate()).padStart(2, '0') + 
                    String(currentTime.getHours()).padStart(2, '0') + 
                    String(currentTime.getMinutes()).padStart(2, '0') + 
                    String(currentTime.getSeconds()).padStart(2, '0');
                
                html += `
                    <p>跳转时间未到</p>
                    <p>目标时间：<strong>${timerStr || '未设置'}</strong></p>
                    <p>当前时间：${currentTime.toLocaleString()}</p>
                    <p style="font-size:12px;color:#999;">（格式：${formattedTime}）</p>
                    <button class="btn-share" id="shareBtn">📤 分享XML卡片</button>
                    <div class="info">
                        <strong>提示：</strong>点击按钮分享此卡片给好友
                    </div>
                    <div class="time-info">
                        浏览器支持情况：${navigator.share ? '快点分享吧！倒计时结束后将会直接跳转到目标网址' : '不支持分享哦，请换个浏览器'}
                    </div>
                `;
            } else {
                // 时间已到 - 显示跳转中
                html += `
                    <p>⏳ 正在跳转...</p>
                    <p style="font-size:12px;color:#999;">如果未自动跳转，请点击 <a href="${getParam('url') || '#'}">这里</a></p>
                `;
            }

            container.innerHTML = html;

            // 绑定分享事件（仅在时间未到时）
            if (timeNotReached) {
                const shareBtn = document.getElementById('shareBtn');
                if (shareBtn) {
                    shareBtn.addEventListener('click', shareCard);
                    console.log('✅ 分享按钮已绑定');
                }
            }
        }

        // ====== 主逻辑 ======
        console.log('🚀 页面加载开始');
        console.log('📋 URL参数:', window.location.search);

        // 先更新 Meta
        updateMeta();

        // 获取参数
        const jumpUrl = getParam('url');
        const timerStr = getParam('timer');

        console.log('跳转URL:', jumpUrl);
        console.log('定时器:', timerStr);

        // 判断时间是否到达
        const timeReached = isAfterTime(timerStr);
        console.log('时间是否到达:', timeReached);

        if (timeReached) {
            // 时间到达，执行跳转
            console.log('⏰ 时间已到，执行跳转');
            forceJump(jumpUrl);
        } else {
            // 时间未到，显示页面（包含分享按钮）
            console.log('⏳ 时间未到，显示分享卡片');
            renderPage(true);
        }
    </script>
</body>
</html>
